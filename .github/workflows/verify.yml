name: Verify development build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Receipt verification server regressions
        run: node --test server/receipt-verifier.test.mjs
      - name: Install pinned Worker tooling
        working-directory: server
        run: npm ci
      - name: Validate Cloudflare Worker bundle
        working-directory: server
        run: npx wrangler deploy --dry-run --outdir ../build/receipt-worker
      - name: Identification server contracts and SQLite budget
        working-directory: server
        run: |
          node --test plant-identification.test.mjs plantnet-budget.test.mjs
          npx wrangler deploy --config wrangler.plantnet.jsonc --dry-run --outdir ../build/identification-worker
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Build, JVM tests and Android lint
        run: bash gradlew --no-daemon :core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleBenchmark :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease
      - name: Supporting regression tests
        # The checkout timing detector validates retained actual Fire captures.
        # Pin the same image decoder used for its local regression run.
        run: |
          python -m pip install Pillow==12.2.0
          python -m unittest discover -s tools -p 'test_*.py' -v
          bash -n tools/record_unplugged_energy.sh
      - name: Audit Android configuration
        run: python tools/audit_source.py
      - name: Validate draft listing fields
        run: python tools/audit_metadata.py
      - name: Extract Android source strings
        run: python tools/localize.py extract
      - name: Build and validate local static website
        run: |
          python website/build.py
          python website/validate.py
      - name: Regenerate evidence-gated acceptance matrix
        run: python tools/report_acceptance.py
      - name: Retain test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-verification
          path: |
            core/build/reports/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/benchmark/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            website/dist/build-report.json
            ACCEPTANCE_TEST_RESULTS.csv
            RELEASE_READINESS.md
          if-no-files-found: warn
